<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f7f4">
<title>Sabq Kashf | Choose your portal</title>
<style>
  :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17231c; background: #f4f7f4; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 18px; background: radial-gradient(ellipse at 50% 5%, #e2f5e9 0, #f4f7f4 54%); }
  main { width: min(100%, 520px); text-align: center; }
  .mark { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 50%; background: linear-gradient(145deg, #57dda0, #138b50); box-shadow: 0 10px 24px #168b5040; }
  h1 { margin: 0; font-size: clamp(30px, 7vw, 42px); letter-spacing: -.04em; }
  .intro { margin: 10px 0 30px; color: #637168; line-height: 1.6; }
  nav { display: grid; gap: 12px; }
  a { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 19px; border: 1px solid #e2e9e3; border-radius: 18px; color: inherit; background: #fff; text-decoration: none; text-align: left; box-shadow: 0 5px 18px #203b2910; transition: transform .16s ease, box-shadow .16s ease; }
  a:hover, a:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 24px #203b2918; outline: 2px solid #22985c; outline-offset: 2px; }
  .title { display: block; font-weight: 650; font-size: 16px; }
  .desc { display: block; margin-top: 4px; color: #718078; font-size: 13px; }
  .arrow { color: #168b50; font-size: 23px; }
  footer { margin-top: 25px; color: #88948d; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>Sabq Kashf</h1>
  <p class="intro">Family screening and care coordination<br>Choose your portal to continue.</p>
  <nav aria-label="Sabq Kashf portals">
    <a href="/doh"><span><span class="title">Screening programme</span><span class="desc">Department of Health team</span></span><span class="arrow" aria-hidden="true">→</span></a>
    <a href="/app"><span><span class="title">Resident portal</span><span class="desc">Invitations, appointments and screening updates</span></span><span class="arrow" aria-hidden="true">→</span></a>
    <a href="/doctor"><span><span class="title">Doctor portal</span><span class="desc">Referrals, appointments and care outcomes</span></span><span class="arrow" aria-hidden="true">→</span></a>
  </nav>
  <footer>Sabq Kashf</footer>
</main>
</body>
</html>
