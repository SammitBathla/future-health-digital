<title>SANAD Family Relay</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#17305c; --navy-dark:#0f1f3d; --teal:#0f9488; --teal-light:#e3f5f2;
  --rose:#c63a56; --rose-light:#fbe7eb; --amber:#d98a2b; --amber-light:#fbedda;
  --ink:#1c2430; --muted:#6b7686; --line:#e7eaf0; --bg:#f4f6f9; --card:#ffffff;
  --radius:18px; --shadow:0 2px 10px rgba(23,48,92,.06), 0 1px 2px rgba(23,48,92,.04);
  --font:"Segoe UI", "Helvetica Neue", Arial, "Noto Kufi Arabic", sans-serif;
  color-scheme: light;
}
.emo{display:inline-block; font-style:normal; line-height:1;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%; background:var(--bg); font-family:var(--font); color:var(--ink);}
body{display:flex; justify-content:center;}
#app{width:100%; max-width:480px; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column; box-shadow:0 0 40px rgba(0,0,0,.06);}
@media(min-width:900px){ body{align-items:flex-start; padding-top:24px;} #app{min-height:860px; border-radius:28px; overflow:hidden; margin-bottom:24px;} }

[dir="rtl"] body{font-family:"Segoe UI","Noto Kufi Arabic",Tahoma,sans-serif;}

/* Top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; background:var(--navy); color:#fff; position:sticky; top:0; z-index:20;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{width:34px; height:34px; border-radius:10px; background:var(--teal); display:flex; align-items:center; justify-content:center; font-size:16px;}
.brand h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.3px;}
.brand span{display:block; font-size:10.5px; color:#b9c6e0; font-weight:400;}
.langbtn{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;}
.langbtn:active{background:rgba(255,255,255,.26);}

/* Screens */
.screen{display:none; padding:16px 16px 90px; flex:1; animation:fade .18s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.page-title{font-size:19px; font-weight:800; margin:4px 0 2px; color:var(--navy-dark);}
.page-sub{font-size:12.5px; color:var(--muted); margin:0 0 14px;}

/* Cards */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px;}
.card h3{margin:0 0 8px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
.card h3 .emo{width:18px; text-align:center; display:inline-block;}
.caption{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.5;}

/* Stat tiles */
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
.stat{border-radius:16px; padding:14px 8px; text-align:center; box-shadow:var(--shadow);}
.stat .num{font-size:21px; font-weight:800; line-height:1.1;}
.stat .lbl{font-size:10px; margin-top:4px; font-weight:600; line-height:1.3;}
.stat.rose{background:var(--rose-light); color:var(--rose);}
.stat.amber{background:var(--amber-light); color:var(--amber);}
.stat.teal{background:var(--teal-light); color:var(--teal);}

/* Icon step row */
.steps{display:flex; justify-content:space-between; gap:6px; margin:10px 0 4px;}
.step{flex:1; text-align:center; font-size:10px; color:var(--muted); font-weight:600;}
.step .circ{width:40px; height:40px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 6px; font-size:16px;}
.step.active .circ{background:var(--teal);}
.step.done .circ{background:var(--teal); opacity:.55;}
.steps-arrow{display:none;}

/* chip row */
.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
.chip{flex:0 0 auto; display:flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap;}
.chip .emo{display:inline-block;}
.chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.chip.active .emo{filter:none;}

/* why list */
.why-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); align-items:flex-start;}
.why-item:last-child{border-bottom:none;}
.why-num{width:22px; height:22px; border-radius:50%; background:var(--rose); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:1px;}
.why-text b{display:block; font-size:13px;}
.why-text small{color:var(--muted); font-size:11px;}

.badge{display:inline-block; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
.badge.elevated{background:var(--rose-light); color:var(--rose);}
.badge.confidence{background:#eef1f6; color:var(--muted); font-weight:600; margin-top:10px; display:block; padding:8px 10px; border-radius:10px;}

.actions{display:flex; gap:8px; margin-top:12px;}
.btn{flex:1; border:none; border-radius:12px; padding:11px 6px; font-size:12px; font-weight:700; cursor:pointer;}
.btn.primary{background:var(--teal); color:#fff;}
.btn.secondary{background:var(--amber-light); color:var(--amber);}
.btn.ghost{background:#eef1f6; color:var(--muted);}
.btn:active{transform:scale(.97);}

.toast{position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px); background:var(--navy-dark); color:#fff; padding:11px 18px; border-radius:12px; font-size:12.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:all .25s ease; z-index:60; max-width:85%; text-align:center;}
[dir="rtl"] .toast{transform:translateX(50%) translateY(20px);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
[dir="rtl"] .toast.show{transform:translateX(50%) translateY(0);}

/* family tree */
.tree{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:6px;}
.tree .me{background:var(--navy); color:#fff; border-radius:14px; padding:10px 20px; font-weight:700; font-size:13px; text-align:center;}
.tree .me small{display:block; font-weight:400; font-size:10.5px; color:#b9c6e0;}
.branch-line{width:2px; height:14px; background:var(--line);}
.relatives{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; width:100%;}
.relative{background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:10px; display:flex; justify-content:space-between; align-items:center; gap:6px;}
.relative .who{font-size:12px; font-weight:700;}
.relative .who small{display:block; font-weight:400; color:var(--muted); font-size:10px;}
.switch{width:36px; height:21px; border-radius:999px; background:#d7dce3; position:relative; cursor:pointer; flex:0 0 auto; transition:.2s;}
.switch i{position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.3);}
.switch.on{background:var(--teal);}
.switch.on i{left:17px;}
[dir="rtl"] .switch i{left:auto; right:2px;}
[dir="rtl"] .switch.on i{right:17px; left:auto;}

.msg-preview{background:var(--teal-light); border-radius:14px; padding:12px; font-size:12.5px; color:#0b5f56; margin-top:10px; line-height:1.6;}

/* trust list */
.trust-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:flex-start;}
.trust-item:last-child{border-bottom:none;}
.trust-item .ic{width:38px; height:38px; border-radius:11px; background:var(--teal-light); color:var(--teal); display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;}
.trust-item b{font-size:13px; display:block;}
.trust-item small{color:var(--muted); font-size:11.5px;}

/* bottom nav */
.tabbar{position:sticky; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; z-index:30; max-width:480px; margin:0 auto; width:100%;}
.tab{flex:1; text-align:center; padding:9px 2px 10px; cursor:pointer; color:var(--muted); font-size:10px; font-weight:600;}
.tab .emo{display:block; font-size:17px; margin-bottom:3px;}
.tab.active{color:var(--teal);}

.chart-wrap{position:relative; height:190px;}
.legend-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.legend-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-inline-end:5px;}
.legend-item{font-size:11px; color:var(--muted); display:flex; align-items:center;}

.persona-card{display:flex; gap:10px; align-items:center;}
.persona-card .av{width:44px; height:44px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex:0 0 auto;}
.persona-card .nm{font-weight:800; font-size:15px;}
.persona-card .rl{font-size:11.5px; color:var(--muted);}

.source-box{font-size:10.5px; color:var(--muted); line-height:1.7; background:#eef1f6; border-radius:12px; padding:10px 12px;}

</style>

</div>

function t() { return STR[lang]; }

function fmtNum(n) {
  return lang === "ar" ? n.toLocaleString("ar-EG") : n.toLocaleString("en-US");
}

function setLang(l) {
  lang = l;
  localStorage.setItem("sanad_lang", l);
  document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
  document.documentElement.setAttribute("lang", l);
  renderAll();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

const COLORS = ["#c63a56","#d98a2b","#0f9488","#17305c","#7c93c9","#b9c6e0"];

function destroyCharts() { Object.values(charts).forEach(c => c && c.destroy()); charts = {}; }

function buildCharts() {
  destroyCharts();
  const s = t().insights;
  const fontColor = "#1c2430";
  Chart.defaults.font.family = "Segoe UI, Tahoma, sans-serif";
  Chart.defaults.color = fontColor;

  charts.cases = new Chart(document.getElementById("chartCases"), {
    type: "bar",
    data: {
      labels: DATA.siteAll.map(x => L(x[0], lang)),
      datasets: [{ data: DATA.siteAll.map(x => x[1]), backgroundColor: COLORS[0], borderRadius: 6, maxBarThickness: 18 }]
    },
    options: { indexAxis: "y", plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { display: false } } } }
  });

  const menMap = Object.fromEntries(DATA.siteMen);
  const womenMap = Object.fromEntries(DATA.siteWomen);
  const genderCats = [...new Set([...DATA.siteMen.map(x => x[0]), ...DATA.siteWomen.map(x => x[0])])]
    .sort((a, b) => ((womenMap[b]||0)+(menMap[b]||0)) - ((womenMap[a]||0)+(menMap[a]||0)))
    .slice(0, 7);
  charts.gender = new Chart(document.getElementById("chartGender"), {
    type: "bar",
    data: {
      labels: genderCats.map(c => L(c, lang)),
      datasets: [
        { label: s.men, data: genderCats.map(c => menMap[c] || 0), backgroundColor: "#17305c", borderRadius: 5, maxBarThickness: 12 },
        { label: s.women, data: genderCats.map(c => womenMap[c] || 0), backgroundColor: "#c63a56", borderRadius: 5, maxBarThickness: 12 }
      ]
    },
    options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 9, font: { size: 10.5 } } } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 9.5 } } }, y: { grid: { color: "#eef1f6" } } } }
  });

  charts.stage = new Chart(document.getElementById("chartStage"), {
    type: "doughnut",
    data: { labels: DATA.seerStage.map(x => L(x[0], lang)), datasets: [{ data: DATA.seerStage.map(x => x[1]), backgroundColor: COLORS, borderWidth: 2, borderColor: "#fff" }] },
    options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 9, font: { size: 10 } } } }, cutout: "60%" }
  });

  charts.obesity = new Chart(document.getElementById("chartObesity"), {
    type: "bar",
    data: { labels: DATA.obesityByAge.map(x => x[0]), datasets: [{ data: DATA.obesityByAge.map(x => x[1]), backgroundColor: "#d98a2b", borderRadius: 6, maxBarThickness: 36 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y + "%" } } }, scales: { y: { ticks: { callback: v => v + "%" }, grid: { color: "#eef1f6" } }, x: { grid: { display: false } } } }
  });

  charts.facilities = new Chart(document.getElementById("chartFacilities"), {
    type: "doughnut",
    data: { labels: DATA.facilitiesSector.map(x => L(x[0], lang)), datasets: [{ data: DATA.facilitiesSector.map(x => x[1]), backgroundColor: ["#17305c", "#0f9488"], borderWidth: 2, borderColor: "#fff" }] },
    options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 9, font: { size: 10.5 } } } }, cutout: "60%" }
  });

  charts.mortality = new Chart(document.getElementById("chartMortality"), {
    type: "line",
    data: { labels: DATA.mortalityTrend.map(x => x[0]), datasets: [{ data: DATA.mortalityTrend.map(x => x[1]), borderColor: "#c63a56", backgroundColor: "rgba(198,58,86,.12)", fill: true, tension: .35, pointRadius: 4, pointBackgroundColor: "#c63a56" }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: "#eef1f6" } }, x: { grid: { display: false } } } }
  });
}

/* ---------- RENDER: RELAY ---------- */
function renderRelay() {
  const s = t().relay;
  const names = { mariam: "M", rajesh: "R", aisha: "A" };
  let body = "";

  if (persona === "aisha") {
    body = `
      <div class="card">
        <h3><span class="emo">🗺️</span> ${s.aishaCard}</h3>
        <p style="font-size:13px; line-height:1.6; margin:0;">${s.aishaText}</p>
      </div>`;
  } else {
    const isM = persona === "mariam";
    const flagLabel = isM ? s.flagLabel : s.rajeshFlag;
    const why = isM ? s.mariamWhy : s.rajeshWhy;
    const suggested = isM ? s.suggested : s.suggestedRajesh;
    body = `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div class="persona-card"><div class="av">${names[persona]}</div><div><div class="nm">${s.personas[persona]}</div><div class="rl">${s.personaRoles[persona]}</div></div></div>
          <span class="badge elevated">${flagLabel}</span>
        </div>
        <h3 style="margin-top:14px;"><span class="emo">📋</span> ${s.whyTitle}</h3>
        ${why.map((w,i) => `
          <div class="why-item">
            <div class="why-num">${i+1}</div>
            <div class="why-text"><b>${w[0]}</b><small>${w[1]}</small></div>
          </div>`).join("")}
        <span class="badge confidence"><span class="emo">◐</span> ${s.confidence}</span>
        <p style="font-size:12.5px; font-weight:700; color:var(--teal); margin:12px 0 0;"><span class="emo">✅</span> ${suggested}</p>
        <div class="actions">
          <button class="btn primary" onclick="relayAction('yes')">${s.yes}</button>
          <button class="btn secondary" onclick="relayAction('remind')">${s.remind}</button>
          <button class="btn ghost" onclick="relayAction('no')">${s.no}</button>
        </div>
        <p class="caption" style="text-align:center;">${s.notDiag}</p>
      </div>`;
  }

  document.getElementById("screen-relay").innerHTML = `
    <h2 class="page-title">${s.title}</h2>
    <p class="page-sub">${s.sub}</p>
    <div class="chip-row">
      ${["mariam","rajesh","aisha"].map(p => `<div class="chip ${p===persona?'active':''}" onclick="selectPersona('${p}')"><span class="emo">👤</span>${s.personas[p]}</div>`).join("")}
    </div>
    ${body}
    <div class="card">
      <h3><span class="emo">🧭</span> ${s.stepTitle}</h3>
      <div class="steps">
        ${s.steps.map((st,i) => `<div class="step ${i<=pathwayStep?'done':''} ${i===pathwayStep?'active':''}"><div class="circ">${i+1}</div>${st}</div>`).join("")}
      </div>
    </div>
  `;
}

function selectPersona(p) { persona = p; renderRelay(); }

function relayAction(kind) {
  const s = t().relay;
  if (kind === "yes") { pathwayStep = Math.min(pathwayStep + 1, 5); toast(s.toastYes); }
  else if (kind === "remind") toast(s.toastRemind);
  else toast(s.toastNo);
  renderRelay();
}

/* ---------- NAV / BOOTSTRAP ---------- */
function goTab(name) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.getElementById("tab-" + name).classList.add("active");
  if (name === "insights") buildCharts();
}

function renderTabbar() {
  const s = t().tabs;
  const icons = { home: "fa-house", insights: "fa-chart-pie", relay: "fa-bell", family: "fa-people-roof", trust: "fa-shield-heart" };
  document.getElementById("tabbar").innerHTML = Object.keys(s).map(k =>
    `<div class="tab" id="tab-${k}" onclick="goTab('${k}')"><span class="emo">${ic(icons[k])}</span>${s[k]}</div>`
  ).join("");
}

function renderTopbar() {
  const T = t();
  document.getElementById("brandName").textContent = T.brand;
  document.getElementById("brandSub").textContent = T.brandSub;
  document.getElementById("langLabel").textContent = lang === "en" ? "عربي" : "EN";
}

function renderAll() {
  renderTopbar();
  renderTabbar();
  renderHome();
  renderInsights();
  renderRelay();
  renderFamily();
  renderTrust();
  const active = document.querySelector(".screen.active");
  const activeName = active ? active.id.replace("screen-", "") : "home";
  goTab(activeName);
}

document.addEventListener("DOMContentLoaded", () => {
  document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.documentElement.setAttribute("lang", lang);
  document.getElementById("langBtn").addEventListener("click", () => setLang(lang === "en" ? "ar" : "en"));
  renderAll();
  goTab("home");
});
